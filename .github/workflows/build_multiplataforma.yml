name: Build Multiplataforma (Windows, Linux, macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secret-scan:
    name: Escaneo de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Escanear secretos filtrados
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Compilar ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows
            runner: windows-latest
            artifact_name: IndiServ_Analytica-Windows
            artifact_path: dist/IndiServ_Analytica.exe
          - os_name: Linux
            runner: ubuntu-22.04
            artifact_name: IndiServ_Analytica-Linux
            artifact_path: dist/IndiServ_Analytica-Linux
          - os_name: macOS
            runner: macos-latest
            artifact_name: IndiServ_Analytica-macOS
            artifact_path: dist/IndiServ_Analytica-macOS.zip

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar dependencias de sistema en Linux (Tkinter / X11)
        if: matrix.os_name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libx11-6 libxcb1

      - name: Instalar librerías de Python y PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -c "import customtkinter, PIL, psutil, supabase, dotenv; print('DEPS_OK')"

      - name: Compilar ejecutable autónomo con PyInstaller
        run: python build_executable.py

      - name: Empaquetar .app y binario en macOS
        if: matrix.os_name == 'macOS'
        run: |
          cd dist
          zip -r IndiServ_Analytica-macOS.zip IndiServ_Analytica-macOS.app IndiServ_Analytica-macOS

      - name: Subir ejecutable descargable (Artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publicar GitHub Release Público
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar ejecutables compilados
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Publicar o actualizar Release en GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: IndiServ Analytica — Descargas Multiplataforma
          body: |
            Descargas directas de **IndiServ Analytica** (sin necesidad de instalar Python ni librerías):
            - **Windows**: `IndiServ_Analytica.exe`
            - **Linux**: `IndiServ_Analytica-Linux` (`chmod +x IndiServ_Analytica-Linux && ./IndiServ_Analytica-Linux`)
            - **macOS**: `IndiServ_Analytica-macOS.zip` (descomprimir y abrir `IndiServ_Analytica-macOS.app`)
          make_latest: true
          files: |
            artifacts/IndiServ_Analytica-Windows/IndiServ_Analytica.exe
            artifacts/IndiServ_Analytica-Linux/IndiServ_Analytica-Linux
            artifacts/IndiServ_Analytica-macOS/IndiServ_Analytica-macOS.zip
